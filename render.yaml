
services:
  - type: web
    name: space-debris-prediction
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SPACETRACK_IDENTITY
        sync: false
      - key: SPACETRACK_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: GOOGLE_MAPS_TILES_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
